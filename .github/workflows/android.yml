name: Talohim

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One build of a branch at a time. Two at once race for the same Gradle cache
# and the same `screens` branch, and the older one can only ever publish a
# picture of code nobody is looking at any more.
#
# Queued, not cancelled. Cancelling took a build out mid-way through writing the
# Gradle cache, and the next build restored what was left of it and sat in
# `testDebugUnitTest` for the best part of an hour. A redundant build costs four
# minutes; a poisoned cache costs the afternoon.
concurrency:
  group: talohim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tizen check, unit tests and debug APK
    runs-on: ubuntu-latest
    # This job is four minutes' work. A runner that has been sitting on one step
    # for half an hour is not working, it is stuck — and without a limit it sits
    # there for six hours before anyone is told.
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The Tizen app has no compiler to catch a typo, so at least keep it
      # syntactically valid and its manifest well-formed.
      - name: Check the Tizen app
        run: |
          node --check tizen/core.js
          node --check tizen/app.js
          node --test tizen/test/parity.test.js
          node --test tizen/test/compat.test.js
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('tizen/config.xml')"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A key that outlives the runner. Without it every build is signed by a
      # different throwaway key, and installing a new one means uninstalling the
      # old — which takes the sign-in details and the history with it.
      - name: Unlock the signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "no signing key configured; this build cannot be installed over an older one"
            echo "ready=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/telohim.jks"
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # The Android screens as pictures. They render on the JVM, so this needs
      # no emulator and costs seconds — and it is the only way anyone gets to
      # look at this app without a television in the room.
      - name: Draw the Android screens
        run: ./gradlew --no-daemon recordRoborazziDebug

      - name: Upload the screens
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: app/src/test/screens/
          if-no-files-found: warn

      # An artifact takes a sign-in and a zip to open, and the whole point of
      # these files is that someone looks at them. A branch of their own is a
      # direct link: /tree/screens renders them as pictures. It holds nothing
      # but the PNGs, so it is never merged anywhere.
      - name: Publish the screens to their own branch
        if: github.ref == 'refs/heads/main'
        run: |
          # A fresh orphan every time: the branch is a picture of the current
          # build, not a history, and a parentless commit cannot trip over the
          # shallow clone the checkout leaves behind.
          work="$RUNNER_TEMP/screens"
          git worktree add --orphan -b screens-build "$work"
          cp app/src/test/screens/*.png "$work"/
          git -C "$work" add -A
          git -C "$work" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "מסכי אנדרואיד מבנייה ${{ github.run_number }}"
          git -C "$work" push --force origin screens-build:screens

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.signing.outputs.ready == 'yes' && format('{0}/telohim.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      # The suite that drives the app the way a remote does: every screen, the
      # player, search, and what it remembers between launches. It runs against
      # a portal that answers like a real one, so a broken screen fails here
      # rather than on someone's television.
      - name: Walk the Tizen app end to end
        run: |
          npm install --no-save --silent playwright-core
          python3 -m http.server 5300 --directory tizen &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:5300/index.html && break
            sleep 0.5
          done
          QA_BROWSER=$(command -v google-chrome || command -v chromium-browser || command -v chromium) \
            node tizen/test/qa.mjs

      - name: Name the APK after the build
        run: cp app/build/outputs/apk/debug/app-debug.apk telohim.apk

      # A .wgt is a zip of the web app with config.xml at its root. Building it
      # here is easy; signing it is not — a Samsung TV only installs packages
      # signed with a certificate tied to that TV, so the last step is the
      # owner's to run. The name says so, to save anyone a failed install.
      # The package anyone may download: no sign-in details inside, so it is
      # safe as a public release asset.
      - name: Package the Tizen app
        run: cd tizen && zip -r -q -X ../telohim-unsigned.wgt . -x README.md "test/*"

      # A personal build can be born signed in. The details come from repository
      # secrets, never from the tree, and the package that carries them is
      # uploaded as a workflow artifact — which needs a sign-in to download —
      # rather than attached to the public release.
      - name: Put the development sign-in details into the build
        env:
          XTREAM_SERVER: ${{ secrets.XTREAM_SERVER }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: |
          if [ -z "$XTREAM_USER" ] || [ -z "$XTREAM_PASS" ]; then
            echo "no development sign-in details configured; this build asks for them on screen"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          server = os.environ.get('XTREAM_SERVER') or 'http://ilvips.com:80'
          data = {
              'server': server,
              'user': os.environ['XTREAM_USER'],
              'pass': os.environ['XTREAM_PASS'],
          }
          with open('tizen/dev-credentials.js', 'w', encoding='utf-8') as out:
              out.write('window.TalohimDev = %s;\n' % json.dumps(data, ensure_ascii=False))
          print('sign-in details written for this build')
          PY

      - name: Package the personal Tizen app
        env:
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
        run: |
          if [ -z "$XTREAM_USER" ]; then
            echo "no personal build to make"
            exit 0
          fi
          cd tizen && zip -r -q -X ../telohim-personal.wgt . -x README.md "test/*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telohim-builds
          path: |
            telohim.apk
            telohim-unsigned.wgt
            telohim-personal.wgt
          # The personal package only exists when the sign-in secrets are set;
          # a missing APK still fails the build, at the release step below.
          if-no-files-found: warn

      # Downloading an Actions artifact means signing in and unzipping, which is
      # painful on the phone the app is meant for. A release asset is a direct
      # link, and keeping the file name fixed makes
      # /releases/latest/download/telohim.apk always point at the newest build.
      - name: Publish the build as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" telohim.apk telohim-unsigned.wgt \
            --title "טלוהים — בנייה ${{ github.run_number }}" \
            --notes "telohim.apk — אנדרואיד ו-Android TV, מוכן להתקנה. telohim-unsigned.wgt — Samsung Tizen, דורש חתימה בתעודה שלך לפני התקנה. נבנה מ-${{ github.sha }}." \
            --latest
