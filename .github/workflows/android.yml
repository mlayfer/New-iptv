name: Talohim

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Tizen check, unit tests and debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The Tizen app has no compiler to catch a typo, so at least keep it
      # syntactically valid and its manifest well-formed.
      - name: Check the Tizen app
        run: |
          node --check tizen/core.js
          node --check tizen/app.js
          node --test tizen/test/parity.test.js
          node --test tizen/test/compat.test.js
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('tizen/config.xml')"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # The suite that drives the app the way a remote does: every screen, the
      # player, search, and what it remembers between launches. It runs against
      # a portal that answers like a real one, so a broken screen fails here
      # rather than on someone's television.
      - name: Walk the Tizen app end to end
        run: |
          npm install --no-save --silent playwright-core
          python3 -m http.server 5300 --directory tizen &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:5300/index.html && break
            sleep 0.5
          done
          QA_BROWSER=$(command -v google-chrome || command -v chromium-browser || command -v chromium) \
            node tizen/test/qa.mjs

      - name: Name the APK after the build
        run: cp app/build/outputs/apk/debug/app-debug.apk telohim.apk

      # A .wgt is a zip of the web app with config.xml at its root. Building it
      # here is easy; signing it is not — a Samsung TV only installs packages
      # signed with a certificate tied to that TV, so the last step is the
      # owner's to run. The name says so, to save anyone a failed install.
      # The package anyone may download: no sign-in details inside, so it is
      # safe as a public release asset.
      - name: Package the Tizen app
        run: cd tizen && zip -r -q -X ../telohim-unsigned.wgt . -x README.md "test/*"

      # A personal build can be born signed in. The details come from repository
      # secrets, never from the tree, and the package that carries them is
      # uploaded as a workflow artifact — which needs a sign-in to download —
      # rather than attached to the public release.
      - name: Put the development sign-in details into the build
        env:
          XTREAM_SERVER: ${{ secrets.XTREAM_SERVER }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: |
          if [ -z "$XTREAM_USER" ] || [ -z "$XTREAM_PASS" ]; then
            echo "no development sign-in details configured; this build asks for them on screen"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          server = os.environ.get('XTREAM_SERVER') or 'http://ilvips.com:80'
          data = {
              'server': server,
              'user': os.environ['XTREAM_USER'],
              'pass': os.environ['XTREAM_PASS'],
          }
          with open('tizen/dev-credentials.js', 'w', encoding='utf-8') as out:
              out.write('window.TalohimDev = %s;\n' % json.dumps(data, ensure_ascii=False))
          print('sign-in details written for this build')
          PY

      - name: Package the personal Tizen app
        env:
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
        run: |
          if [ -z "$XTREAM_USER" ]; then
            echo "no personal build to make"
            exit 0
          fi
          cd tizen && zip -r -q -X ../telohim-personal.wgt . -x README.md "test/*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telohim-builds
          path: |
            telohim.apk
            telohim-unsigned.wgt
            telohim-personal.wgt
          # The personal package only exists when the sign-in secrets are set;
          # a missing APK still fails the build, at the release step below.
          if-no-files-found: warn

      # Downloading an Actions artifact means signing in and unzipping, which is
      # painful on the phone the app is meant for. A release asset is a direct
      # link, and keeping the file name fixed makes
      # /releases/latest/download/telohim.apk always point at the newest build.
      - name: Publish the build as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" telohim.apk telohim-unsigned.wgt \
            --title "טלוהים — בנייה ${{ github.run_number }}" \
            --notes "telohim.apk — אנדרואיד ו-Android TV, מוכן להתקנה. telohim-unsigned.wgt — Samsung Tizen, דורש חתימה בתעודה שלך לפני התקנה. נבנה מ-${{ github.sha }}." \
            --latest
